<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Botánico - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f1ea; color: #333333;">

    <nav style="background-color: #2e5a44; padding: 15px; text-align: center;">
        <a href="index.html" style="color: #ffffff; margin-right: 20px; text-decoration: none; font-weight: bold;">Inicio</a>
        <a href="about.html" style="color: #ffffff; margin-right: 20px; text-decoration: none; font-weight: bold;">Nosotros</a>
        <a href="contact.html" style="color: #ffffff; text-decoration: none; font-weight: bold;">Contacto</a>
    </nav>

    <main style="padding: 40px; max-width: 450px; margin: 0 auto;">
        <h1 style="color: #2e5a44; text-align: center;">Contacto</h1>
        
        <form style="background-color: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre:</label>
            <input type="text" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Correo electrónico:</label>
            <input type="email" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Mensaje:</label>
            <textarea rows="4" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>

            <button type="submit" style="background-color: #2e5a44; color: #ffffff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;">
                Enviar Mensaje
            </button>
        </form>
    </main>

</body>
</html>
